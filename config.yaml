interests:
  - name: "底层视觉"
    arxiv_categories: ["cs.CV", "eess.IV"]
    keywords:
      - "super-resolution"
      - "denoising"
      - "deblurring"
      - "image restoration"
      - "image enhancement"
      - "low-light"
      - "HDR"
      - "inpainting"
      - "deraining"
      - "dehazing"
    search_queries:
      - "image super resolution deep learning"
      - "image restoration diffusion model"
      - "image quality enhancement"
      - "image editing"
    description: "图像超分、去噪、去模糊、增强、修复等底层视觉任务"

  - name: "视频算法"
    arxiv_categories: ["cs.CV", "cs.MM"]
    keywords:
      - "video generation"
      - "video editing"
      - "video enhancement"
      - "video super-resolution"
      - "video interpolation"
      - "video quality"
      - "video restoration"
      - "video diffusion"
    search_queries:
      - "video generation diffusion model"
      - "video quality enhancement neural network"
      - "video editing"
    description: "视频生成、编辑、增强、质量评估等"

  - name: "图像生成"
    arxiv_categories: ["cs.CV", "cs.AI"]
    keywords:
      - "text-to-image"
      - "image generation"
      - "image synthesis"
      - "diffusion model"
      - "stable diffusion"
      - "ControlNet"
      - "image-to-image"
      - "inpainting generation"
      - "personalization"
      - "DreamBooth"
      - "LoRA"
      - "IP-Adapter"
    search_queries:
      - "text to image diffusion model"
      - "controllable image generation"
      - "personalized image synthesis"
    description: "文生图、可控生成、个性化生成、扩散模型等"

  - name: "多模态大模型"
    arxiv_categories: ["cs.CV", "cs.CL", "cs.AI"]
    keywords:
      - "multimodal"
      - "vision-language"
      - "VLM"
      - "GPT-4V"
      - "LLaVA"
      - "visual instruction"
      - "image understanding"
      - "visual reasoning"
      - "MLLM"
      - "omni-modal"
    search_queries:
      - "multimodal large language model vision"
      - "visual instruction tuning"
      - "vision language model benchmark"
    description: "多模态大模型、视觉语言模型、图文理解等"

  - name: "AI Agent"
    arxiv_categories: ["cs.AI", "cs.CL"]
    keywords:
      - "AI agent"
      - "tool use"
      - "function calling"
      - "code generation"
      - "autonomous agent"
      - "planning"
      - "reasoning"
      - "chain-of-thought"
      - "self-reflection"
      - "multi-agent"
    search_queries:
      - "autonomous AI agent tool use"
      - "LLM agent planning reasoning"
      - "multi-agent collaboration"
    description: "AI智能体、工具使用、代码生成、自主规划等"

sources:
  arxiv:
    enabled: true
    max_results_per_category: 100
    lookback_days: 3

  hf_daily:
    enabled: true
    lookback_days: 3

  s2_search:
    enabled: true
    limit_per_query: 20

  rss:
    enabled: false
    feeds:
      - name: "HuggingFace Daily Papers"
        url: "https://huggingface.co/papers/rss"
      - name: "PapersWithCode"
        url: "https://paperswithcode.com/latest/rss"

  # One-shot conference sweep (used by `python main.py cvpr`, not the daily run)
  cvpr:
    enabled: true
    year: 2026
    concurrency: 4
    timeout: 15

# One-shot conference sweeps (python main.py <key>). Each writes to its own
# <slug> namespace and never touches the daily DB / daily site pages.
conferences:
  cvpr:
    fetcher: cvpr
    year: 2026
    slug: cvpr2026
    title: "CVPR 2026 精选"
    concurrency: 4
    timeout: 15
    awards: true            # inject best-paper / award-candidate list on top
    award_statuses: ["Award Candidate", "Best Paper", "Best Student Paper"]
  aaai:
    fetcher: aaai
    year: 2026
    slug: aaai2026
    title: "AAAI 2026 精选"
    concurrency: 4
    timeout: 15
    awards: true
    award_statuses: ["Award Candidate", "Best Paper", "Oral"]
  eccv:
    fetcher: eccv
    year: 2026
    slug: eccv2026
    title: "ECCV 2026 底层视觉精选"
    concurrency: 4
    timeout: 30
    awards: false          # ECCV 2026 awards not announced yet (Oct 2026)
  icml:
    fetcher: papercopilot_full   # full accepted list from Paper Copilot JSON
    year: 2026
    slug: icml2026
    title: "ICML 2026 精选"
    concurrency: 4
    timeout: 180                 # 30MB JSON
    awards: false                # no Award Candidate status published yet
    # accept_statuses omitted = keep all (ICML dump is accepted-only: Poster/Spotlight)
  iclr:
    fetcher: papercopilot_full
    year: 2026
    slug: iclr2026
    title: "ICLR 2026 精选"
    concurrency: 4
    timeout: 180                 # ~90MB git-LFS JSON (media-host fallback)
    awards: false
    # OpenReview dump includes rejects/withdrawals — keep only accepted decisions.
    # Substring match, so "Poster"/"Oral" also catch "...ConditionalPoster/Oral".
    accept_statuses: ["Poster", "Oral"]
  acl:
    fetcher: acl
    year: 2026
    slug: acl2026
    title: "ACL 2026 精选"
    concurrency: 4
    timeout: 60                  # ~7MB Anthology XML dump
    awards: false                # ACL best papers announced at the conference
    # volumes omitted = research volumes (long/short/findings/industry/srw/demo), excl tutorials

enrichment:
  enabled: true
  timeout: 10
  max_authors_per_paper: 5

filter:
  keyword_threshold: 1
  llm_relevance_threshold: 7
  llm_model: "xiaomi/mimo-v2.5-pro"
  llm_batch_size: 20

summary:
  enabled: true

output:
  feishu:
    enabled: true
    wiki_space: ""
  feishu_bot:
    enabled: true
    webhook_url_env: "FEISHU_BOT_WEBHOOK_URL"
    test_webhook_url_env: "FEISHU_BOT_WEBHOOK_URL_TEST"
    pages_base_url: "https://yuqiangy.github.io/paper-tracker"
  html:
    enabled: true
    output_dir: "site/"
    title: "Paper Tracker"
    deploy_cmd: "bash deploy.sh"
    # Topic pages shown in a separate "专题精选" section on the index (one-off
    # conference sweeps etc.). Slug maps to site/<slug>.html.
    features:
      - slug: "cvpr2026"
        title: "CVPR 2026 精选"
      - slug: "aaai2026"
        title: "AAAI 2026 精选"
      - slug: "eccv2026"
        title: "ECCV 2026 底层视觉精选"
      - slug: "icml2026"
        title: "ICML 2026 精选"
      - slug: "iclr2026"
        title: "ICLR 2026 精选"
      - slug: "acl2026"
        title: "ACL 2026 精选"
